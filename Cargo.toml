[package]
name = "auditforge"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "Userspace collector that normalizes Linux auditd log records as JSON Lines"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"

[dev-dependencies]
serde_json = "1.0"
